<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="description" content="SK8.IO — a realistic skateboarding simulator in your browser. Flick-it trick controls, real physics, custom skaters and boards, object dropper." />
    <title>SK8.IO Demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0f'/%3E%3Crect x='8' y='27' width='48' height='10' rx='5' fill='%23ff5a1f'/%3E%3Ccircle cx='19' cy='44' r='5' fill='%23f2f2f0'/%3E%3Ccircle cx='45' cy='44' r='5' fill='%23f2f2f0'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d0f; color: #f2f2f0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0d0f; z-index: 50; transition: opacity 0.6s ease; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .mark { font: 900 64px/1 Impact, 'Arial Black', sans-serif; letter-spacing: 0.04em; }
      #boot .mark b { color: #ff5a1f; }
      #boot .bar { margin: 22px auto 0; width: 220px; height: 3px; background: #222; overflow: hidden; border-radius: 2px; }
      #boot .bar i { display: block; height: 100%; width: 30%; background: #ff5a1f; animation: load 1s ease-in-out infinite; }
      #boot .msg { margin-top: 14px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.6; text-align: center; }
      #boot .err { color: #ff7a6a; max-width: 560px; text-align: center; font-size: 14px; letter-spacing: 0; text-transform: none; opacity: 1; }
      @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div>
        <div class="mark">SK8<b>.</b>IO</div>
        <div class="bar"><i></i></div>
        <div class="msg" id="boot-msg">Building the park…</div>
      </div>
    </div>
    <script type="module" src="/src/demo/main.js"></script>
  </body>
</html>
